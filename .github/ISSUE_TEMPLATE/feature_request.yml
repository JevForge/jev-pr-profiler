name: Feature request
description: Suggest an improvement for JEV Pull Request Profiler
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include API keys, tokens, credentials or other secrets.**
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should the Action behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
